<title>Agamotto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Archivo:wght@400..700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap&text=__ZH_DISPLAY_TEXT__">
<style>
/* Layout: a vertical watch-order rail. A sticky franchise chip row (All plus one per franchise) recolors the page; each continuity is its own section with a timeline rail (when · node · card). Desktop adds a
   sticky section index on the left. */
:root {
  --bg: #f2f3f6;
  --surface: #ffffff;
  --sunk: #e7e9ef;
  --line: #d6dae3;
  --fg: #141821;
  --muted: #5a6273;
  --marvel: #c8102e;
  --xmen: #976200;
  --dc: #0a5bd3;
  --starwars: #8a6a00;
  --alien: #5f7300;
  --godzilla: #00788a;
  --apes: #80542f;
  --dune: #b4530b;
  --middleearth: #2b7a4b;
  --wizarding: #7046a8;
  --westeros: #55657a;
  --all: #3b3f8f;
  --on-accent: #ffffff;
  --on-brand: #ffffff;
  --upcoming: #0d7a5f;
  --imdb: #f5c518;
  --imdb-ink: #121212;
  --douban: #1a782c;
  --rt-fresh: #e0310b;
  --rt-rotten: #09863e;
  --mine-imdb: #1d64c8;
  --mine-star: #b87400;
  --err: #c42a0a;
  --field: #858c9b;
  --accent: var(--all);

  --display: "League Gothic", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --display-zh: "ZCOOL QingKe HuangYou", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --body: "Archivo", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r-sm: 4px;
  --r-md: 8px;
  --timecol: 118px;
  --gap: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e13; --surface: #151922; --sunk: #1d222d; --line: #2a303d; --fg: #e8ebf1; --muted: #98a1b3;
    --marvel: #ff5266; --xmen: #ffc23d; --dc: #5aa2ff; --starwars: #ffe81f; --all: #a9adff;
    --alien: #c8e64a; --godzilla: #3fd6e3; --apes: #d9a574; --dune: #ffad5c; --middleearth: #6fd39a; --wizarding: #c7a6ff; --westeros: #b4c3d4;
    --on-accent: #0c0e13; --on-brand: #0c0e13; --upcoming: #46d6a8;
    --douban: #45c35c; --rt-fresh: #ff6a45; --rt-rotten: #3bd27a;
    --mine-imdb: #6ea8ff; --mine-star: #ffb43d; --err: #ff6a45; --field: #646d7f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e13; --surface: #151922; --sunk: #1d222d; --line: #2a303d; --fg: #e8ebf1; --muted: #98a1b3;
  --marvel: #ff5266; --xmen: #ffc23d; --dc: #5aa2ff; --starwars: #ffe81f; --all: #a9adff;
  --alien: #c8e64a; --godzilla: #3fd6e3; --apes: #d9a574; --dune: #ffad5c; --middleearth: #6fd39a; --wizarding: #c7a6ff; --westeros: #b4c3d4;
  --on-accent: #0c0e13; --on-brand: #0c0e13; --upcoming: #46d6a8;
  --douban: #45c35c; --rt-fresh: #ff6a45; --rt-rotten: #3bd27a;
  --mine-imdb: #6ea8ff; --mine-star: #ffb43d; --err: #ff6a45; --field: #646d7f;
  color-scheme: dark;
}
[data-f="marvel"] { --accent: var(--marvel); }
[data-f="xmen"] { --accent: var(--xmen); }
[data-f="dc"] { --accent: var(--dc); }
[data-f="starwars"] { --accent: var(--starwars); }
[data-f="alien"] { --accent: var(--alien); }
[data-f="godzilla"] { --accent: var(--godzilla); }
[data-f="apes"] { --accent: var(--apes); }
[data-f="dune"] { --accent: var(--dune); }
[data-f="middleearth"] { --accent: var(--middleearth); }
[data-f="wizarding"] { --accent: var(--wizarding); }
[data-f="westeros"] { --accent: var(--westeros); }
[data-f="all"] { --accent: var(--all); }

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 96px) + 8px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
#main:focus { outline: none; }
.skip { position: absolute; left: 16px; top: 8px; z-index: 50; padding: 8px 14px; border-radius: var(--r-md); background: var(--fg); color: var(--bg); font-weight: 600; text-decoration: none; translate: 0 -200%; }
.skip:focus { translate: 0 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }

/* ---------- masthead */
.mast { padding-block: 28px 18px; display: flex; gap: 16px 24px; align-items: end; justify-content: space-between; flex-wrap: wrap; }
.mast h1 { margin: 0; font: 400 clamp(44px, 7vw, 76px)/.86 var(--display); letter-spacing: .01em; text-transform: uppercase; }
html[lang="zh-Hans"] .mast h1 { font-family: var(--display-zh); font-size: clamp(40px, 6vw, 64px); letter-spacing: .04em; line-height: 1; }
.mast h1 .bar { color: var(--accent); transition: color .25s; }
.mast p { margin: 10px 0 0; color: var(--muted); max-width: 62ch; }
.mast-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.stat { font: 500 12px/1.4 var(--mono); color: var(--muted); text-align: right; }
.lang { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.lang button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.tools { display: flex; gap: 8px; align-items: center; }
.mine-btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 13px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--fg); white-space: nowrap; }
.mine-btn:hover { border-color: var(--fg); }
.mine-btn .dots { display: inline-flex; gap: 3px; }
.mine-btn .dots i { width: 8px; height: 8px; border-radius: 50%; }
.mine-btn .dots .imdb { background: var(--imdb); }
.mine-btn .dots .douban { background: var(--douban); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- sticky franchise bar */
.bar-sticky {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.chips { position: relative; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 4px; margin-inline: -4px; }
.chips::-webkit-scrollbar { display: none; }
@media (min-width: 961px) { .chips { flex-wrap: wrap; overflow: visible; } }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px 7px 11px;
  font-size: 13.5px; font-weight: 600; color: var(--fg);
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.chip.all::before { display: none; }
.chip.all { padding-left: 13px; }
.chip .n { font: 500 11px/1 var(--mono); color: var(--muted); }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip[aria-pressed="true"]::before { background: var(--on-accent); }
.chip[aria-pressed="true"] .n { color: inherit; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; background: var(--sunk); border-radius: var(--r-md); padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; cursor: pointer; padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12), inset 0 -2px 0 var(--accent); }
.sortrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); cursor: pointer; padding: 7px 10px; font-size: 13px; font-weight: 600; color: var(--fg); white-space: nowrap; }

/* ---------- filters */
.filters { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding-block: 16px 0; }
.search { position: relative; flex: 1 1 220px; max-width: 340px; min-width: 0; }
.search input { width: 100%; border: 1px solid var(--field); background: var(--surface); color: var(--fg); border-radius: var(--r-md); padding: 9px 12px 9px 34px; font: inherit; font-size: 14px; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }

/* ---------- layout: section index + timeline */
.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 36px; padding-block: 18px 40px; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 96px) + 12px); align-self: start; max-height: calc(100vh - var(--bar-h, 96px) - 36px); overflow-y: auto; padding: 4px; margin: -4px; }
.toc .toc-f { margin: 14px 0 6px; font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toc .toc-f:first-child { margin-top: 4px; }
.toc a {
  display: flex; justify-content: space-between; gap: 8px; align-items: baseline; text-decoration: none;
  padding: 5px 8px; border-radius: 6px; font-size: 13px; color: var(--muted); border-left: 3px solid transparent;
}
.toc a .n { font: 500 11px/1 var(--mono); }
.toc a:hover { color: var(--fg); background: var(--sunk); }
.toc a.on { color: var(--fg); background: var(--surface); border-left-color: var(--accent); font-weight: 600; }
.jump { display: none; position: relative; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 12px 4px 4px; margin-inline: -4px; }
.jump::-webkit-scrollbar { display: none; }
.jump a { flex: none; text-decoration: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; white-space: nowrap; }
.jump a .n { font: 500 11px/1 var(--mono); color: var(--muted); margin-left: 5px; }
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }
  .jump { display: flex; }
}

/* off-screen sections skip layout and paint; the placeholder height is sized from the entry count (measured: about
   168 px per card plus the header, 230 px per card on phones) so the scrollbar and the page end stay close to true */
.section { scroll-margin-top: 12px; padding-bottom: 34px; content-visibility: auto; contain-intrinsic-size: auto calc(var(--rows, 6) * 168px + 150px); }
.sec-head { display: grid; gap: 6px; padding-bottom: 14px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
.sec-head .fr { font: 600 11px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.h2row { display: flex; align-items: baseline; gap: 10px; }
.anchor { font: 400 24px/1 var(--display); color: var(--muted); text-decoration: none; padding: 2px 4px; border-radius: var(--r-sm); white-space: nowrap; }
.anchor:hover, .anchor:focus-visible { color: var(--accent); }
.anchor.done::after { content: attr(data-done); margin-left: 6px; font: 600 12px/1 var(--body); color: var(--accent); vertical-align: 4px; }
.sec-head h2 { margin: 0; font: 400 40px/.95 var(--display); letter-spacing: .015em; text-transform: uppercase; text-wrap: balance; }
html[lang="zh-Hans"] .sec-head h2 { font-family: var(--display-zh); font-size: 32px; letter-spacing: .05em; line-height: 1.1; }
.sec-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 500 12px/1.4 var(--mono); color: var(--muted); }
.sec-meta b { color: var(--fg); font-weight: 500; }

/* ---------- the rail */
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ""; position: absolute; top: 18px; bottom: 18px; left: calc(var(--timecol) + var(--gap) + 13px); width: 2px; background: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.ev { display: grid; grid-template-columns: var(--timecol) 28px minmax(0, 1fr); column-gap: var(--gap); padding-block: 8px; position: relative; }
.when { text-align: right; padding-top: 14px; font: 500 12.5px/1.3 var(--mono); color: var(--fg); overflow-wrap: anywhere; }
.node {
  position: relative; z-index: 1; margin-top: 10px; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font: 500 11px/1 var(--mono);
  background: var(--accent); color: var(--on-accent); box-shadow: 0 0 0 4px var(--bg);
}
.node.dot { width: 14px; height: 14px; margin: 17px auto 0; }
.node.hollow { background: var(--bg); border: 2px solid var(--accent); color: var(--accent); }

.entry { position: relative; display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0; }
.thumb { display: block; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 6px; overflow: hidden; background: var(--sunk); align-self: start; }
button.thumb { border: 0; padding: 0; cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.info { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.when-in { display: none; font: 500 11.5px/1.2 var(--mono); color: var(--accent); }
.info h3 { margin: 0; font-size: 16px; line-height: 1.3; font-weight: 650; text-wrap: balance; overflow-wrap: break-word; }
.info h3 .sb { display: inline-block; vertical-align: 2px; margin-left: 6px; padding: 2px 6px; border-radius: 3px; font: 500 11px/1.2 var(--mono); background: var(--accent); color: var(--on-accent); white-space: nowrap; }
.alt { margin: -3px 0 0; font-size: 12.5px; color: var(--muted); overflow-wrap: break-word; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12.5px; color: var(--muted); }
.meta span + span::before { content: ""; display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .6; margin-right: 12px; vertical-align: .25em; }
.meta .rel { font-family: var(--mono); font-size: 12px; color: var(--fg); }
.up { display: inline-block; padding: 2px 6px; border-radius: 3px; font: 600 10.5px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; background: var(--upcoming); color: var(--on-accent); }

.scores { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 3px; }
.sc { display: inline-flex; align-items: stretch; text-decoration: none; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; font-size: 12px; line-height: 1; background: var(--surface); }
.sc .l { padding: 6px; font-weight: 700; display: grid; place-items: center; }
.sc .v, .sc .v2 { padding: 6px 7px; font: 500 12.5px/1 var(--mono); display: inline-flex; align-items: center; gap: 5px; color: var(--fg); }
.sc .v2 { border-left: 1px solid var(--line); }
.sc .v.na { color: var(--muted); font-family: var(--body); font-size: 11.5px; }
.sc small { font: 600 10px/1 var(--body); color: var(--muted); margin-right: 3px; }
.sc .vn { font-size: 10.5px; color: var(--muted); }
.sc .cf { width: 13px; height: 13px; flex: none; margin-left: -1px; fill: var(--rt-fresh); }
.sc .cf .tick { fill: none; stroke: var(--on-brand); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.sc.imdb .l { background: var(--imdb); color: var(--imdb-ink); }
.sc.douban .l { background: var(--douban); color: var(--on-brand); }
.sc.rt .l { background: var(--rt-fresh); color: var(--on-brand); }
.sc.rt.rotten .l { background: var(--rt-rotten); }
.sc .me { padding: 6px 7px; border-left: 1px solid var(--line); background: var(--sunk); font: 600 12.5px/1 var(--mono); display: inline-flex; align-items: center; gap: 3px; color: var(--fg); }
.sc .me .star { width: 11px; height: 11px; fill: var(--mine-imdb); vertical-align: -1px; margin-right: 2px; }
.stars { display: inline-flex; gap: 1px; vertical-align: -1px; }
.stars svg { width: 11px; height: 11px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; }
.stars svg.on { fill: var(--mine-star); stroke: var(--mine-star); }
.sc .me.seen { color: var(--douban); font-family: var(--body); }
.sc.watch { background: var(--fg); border-color: var(--fg); }
.sc.watch .l { color: var(--bg); font-weight: 600; padding-inline: 9px; }
.sc:hover { border-color: var(--accent); }
.sc.watch:hover { background: var(--accent); border-color: var(--accent); }
.sc.watch:hover .l { color: var(--on-accent); }

details.seasons { margin-top: 2px; font-size: 12.5px; }
details.seasons summary { cursor: pointer; color: var(--muted); font-weight: 600; width: max-content; max-width: 100%; padding-block: 3px; }
details.seasons summary:hover { color: var(--fg); }
.st-wrap { overflow-x: auto; margin-top: 6px; }
.st { border-collapse: collapse; font-size: 12px; min-width: 100%; }
.st th, .st td { padding: 5px 10px 5px 0; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
.st th { font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.st td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.st td a { text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); text-underline-offset: 2px; }
.sec-meta .seen-n { color: var(--fg); }

/* ---------- poster zoom: the thumbnail fills the frame at once, the whole poster fades in over it */
dialog.zoom { border: 0; padding: 0; background: none; max-width: none; max-height: none; overflow: visible; cursor: zoom-out; }
dialog.zoom::backdrop { background: rgb(0 0 0 / .78); }
.zoom figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
.zoom .frame { position: relative; width: var(--w); aspect-ratio: var(--ar, 2 / 3); border-radius: 10px; overflow: hidden; background: var(--sunk) center / cover no-repeat; box-shadow: 0 20px 60px rgb(0 0 0 / .5); animation: zoom-in .22s ease-out both; }
.zoom .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .2s; }
.zoom .frame img.ready { opacity: 1; }
.zoom figcaption { max-width: var(--w); text-align: center; color: #fff; font-weight: 600; font-size: 15px; line-height: 1.35; text-shadow: 0 1px 3px rgb(0 0 0 / .6); }
.zoom figcaption span { display: block; font-weight: 400; font-size: 13px; opacity: .8; }
.zoom .x { position: fixed; top: 14px; right: 14px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgb(255 255 255 / .16); color: #fff; font-size: 22px; line-height: 1; cursor: pointer; }
@keyframes zoom-in { from { opacity: 0; scale: .94; } }

/* ---------- personal ratings dialog */
dialog.mine { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--fg); padding: 0; width: min(580px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); }
dialog.mine::backdrop { background: rgb(0 0 0 / .5); }
.dlg { padding: 18px 20px 20px; display: grid; gap: 14px; }
.dlg-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
.dlg-head h2 { margin: 0; font: 400 30px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
html[lang="zh-Hans"] .dlg-head h2 { font: 600 20px/1.3 var(--body); }
.dlg .x { border: 0; background: var(--sunk); color: var(--fg); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.dlg-intro { margin: 0; color: var(--muted); font-size: 13.5px; }
.src-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; background: var(--bg); }
.src-card h3 { margin: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.src-card .state { font: 500 12px/1.4 var(--mono); color: var(--muted); }
.src-card .state.on { color: var(--fg); }
.src-card ol { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 13px; }
.src-card .hint { margin: 0; font-size: 12px; color: var(--muted); }
.acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.linkish { border: 0; background: none; padding: 0; color: var(--fg); font: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

  function fmtDate(d) {

  // a rating with its vote count; the count is shown small and read out in words

  const CF = '<svg class="cf" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .8l2.3 2 3-.6 1 2.9 2.9 1-.6 3 2 2.3-2 2.3.6 3-2.9 1-1 2.9-3-.6-2.3 2-2.3-2-3 .6-1-2.9-2.9-1 .6-3-2-2.3 2-2.3-.6-3 2.9-1 1-2.9 3 .6z"/><path class="tick" d="m7.4 12.4 3 3 6.2-6.4"/></svg>';
  function scoreChips(t, season) {

    const md = myDouban(t, season);

    const dbMe = md ? `<span class="me${md.v ? "" : " seen"}"><span aria-hidden="true">${md.v ? starsHtml(md.v) : "✓"}</span><span class="vh">${esc(myDbTip)}</span></span>` : "";
    const dbTip = (dbR ? L_.dbTip(dbR.r.toFixed(1), L_.k(dbR.n), dbR.s) : L_.douban) + (md ? " · " + myDbTip : "");
    const douban = `<a class="sc douban" href="${dbHref}" ${ext} title="${esc(dbTip)}"><span class="l">${L_.douban}</span><span class="v${dbR ? "" : " na"}">${dbR ? dbR.r.toFixed(1) + votes(dbR.n, L_.ratingsVh) : L_.na}</span>${dbMe}</a>`;
    // Rotten Tomatoes: series-level score, or the season's own when a season is named

    const aud = rtS == null && rr ? rr.a : null; // older cartoons have only an audience score

    const rtTip = crit != null ? L_.rtTip(crit, aud, rtS == null && rr && rr.cert, rtS != null ? season : null) : aud != null ? L_.rtAud(aud) : L_.rtName;

  function seasonTable(t) {
    const L_ = L();

    const rows = list.map((s) => {
      const db = s.db ? (s.db.r ? `<a href="https://movie.douban.com/subject/${s.db.id}/" ${ext}>${s.db.r.toFixed(1)}</a>` : `<a href="https://movie.douban.com/subject/${s.db.id}/" ${ext}>–</a>`) : "–";

  function entry(row, num) {

    const L_ = L();

    const season = story ? p.s : null;
    const sd = season ? (t.season_list || []).find((x) => x.s === season) : null;
    const title = zh() ? t.zh || t.en : t.en;
    const alt = zh() ? t.en : t.zh;

  function matches(row) {

    const order = [...byCont.keys()].sort((a, b) => (fOrder.indexOf(CONT[a].f) - fOrder.indexOf(CONT[b].f)) || CONT[a].o - CONT[b].o);

        const seen = new Set();
        list = list.filter((r) => (seen.has(r.t.key) ? false : seen.add(r.t.key)));
        list.sort((a, b) => sign * (a.t.date || "9999").localeCompare(b.t.date || "9999") || a.t.en.localeCompare(b.t.en));

      const f = CONT[c].f;

      let span = "";
      if (story) {

      }

      const seen = linked() ? `<span class="seen-n">${esc(L_.seenN(list.filter((r) => isSeen(r.t, story ? r.p.s : null)).length, list.length))}</span>` : "";
      const href = routeOf(state.tab, c);
      html += `<section class="section" id="sec-${c}" data-c="${c}" data-f="${f}" style="--rows:${list.length}" aria-labelledby="h-${c}">

      toc += `<a href="${href}" data-sec="${c}" data-f="${f}"><span>${esc(name)}</span>${count(list.length, L_.entries(list.length))}</a>`;
      jump += `<a href="${href}" data-sec="${c}">${esc(name)}${count(list.length, L_.entries(list.length))}</a>`;
    }
    $("main").innerHTML = html || `<div class="empty">${esc(L_.none)}</div>`;
    $("toc").innerHTML = toc;
    $("jump").innerHTML = jump;

    refocus(keep);

  }

  // the sticky bar's height changes with chip wrapping and font loading; offsets follow it

  function goSec(c, smooth) {

    }

    if (a) {
      e.preventDefault();

    }
    const b = e.target.closest("button");
